<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教員用ダッシュボード</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><div><p class="kicker">学生支援クエスト</p><h1>教員用ダッシュボード</h1><p>提出状況・得点・チームタイプ・神アイテムを確認します。</p></div><button id="reload" class="btn primary">更新</button></header><section class="panel"><div class="grid3"><div class="box"><b>提出チーム数</b><div class="big" id="teamCount">-</div></div><div class="box"><b>平均点</b><div class="big" id="avgScore">-</div></div><div class="box"><b>最高点</b><div class="big" id="maxScore">-</div></div></div><h2>チーム別一覧</h2><div style="overflow:auto"><table id="teamTable"></table></div><h2>チームタイプ分布</h2><div id="typeDist"></div><h2>神アイテムランキング</h2><div id="godRank"></div><p id="status" class="success"></p></section></div><script src="config.js"></script><script>
function jsonp(url,cbName){return new Promise((resolve,reject)=>{window[cbName]=(data)=>{resolve(data);delete window[cbName];script.remove()};const script=document.createElement('script');script.onerror=()=>reject(new Error('読み込み失敗'));script.src=url+(url.includes('?')?'&':'?')+'callback='+cbName+'&_='+Date.now();document.body.appendChild(script)})}
function countBy(arr,key){const o={};arr.forEach(x=>{const v=x[key]||'未設定';o[v]=(o[v]||0)+1});return o}
function renderList(id,obj){const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]);document.getElementById(id).innerHTML=e.length?e.map(([k,v])=>`<div class="box"><b>${k}</b>：${v}</div>`).join(''):'<p>まだデータがありません。</p>'}
async function loadDashboard(){const st=document.getElementById('status');if(!GAS_WEB_APP_URL||GAS_WEB_APP_URL.includes('PASTE_')){st.textContent='config.jsにGAS_WEB_APP_URLを設定してください。';return}st.textContent='読み込み中...';try{const url=GAS_WEB_APP_URL+'?action=summary&eventCode='+encodeURIComponent(EVENT_CODE);const data=await jsonp(url,'dashboardCallback');const rows=data.rows||[];document.getElementById('teamCount').textContent=rows.length;const scores=rows.map(r=>Number(r.totalScore||0));document.getElementById('avgScore').textContent=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):'-';document.getElementById('maxScore').textContent=scores.length?Math.max(...scores):'-';document.getElementById('teamTable').innerHTML='<tr><th>時刻</th><th>チーム</th><th>得点</th><th>タイプ</th><th>神アイテム</th></tr>'+rows.map(r=>`<tr><td>${r.submittedAt||''}</td><td>${r.teamName||''}</td><td>${r.totalScore||0}</td><td>${r.teamTypeTitle||''}</td><td>${r.godItem||''}</td></tr>`).join('');renderList('typeDist',countBy(rows,'teamTypeTitle'));renderList('godRank',countBy(rows,'godItem'));st.textContent='更新しました。'}catch(e){st.textContent='読み込みに失敗しました。GASの公開設定とURLを確認してください。'}}
document.getElementById('reload').onclick=loadDashboard;loadDashboard();
</script></body></html>
